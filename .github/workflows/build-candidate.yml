name: Build and scan release candidate

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: false
        type: string
        default: ""
    outputs:
      archive_sha256:
        value: ${{ jobs.build.outputs.archive_sha256 }}
      manifest_digest:
        value: ${{ jobs.build.outputs.manifest_digest }}
      sbom_sha256:
        value: ${{ jobs.build.outputs.sbom_sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      archive_sha256: ${{ steps.scan.outputs.archive_sha256 }}
      manifest_digest: ${{ steps.scan.outputs.manifest_digest }}
      sbom_sha256: ${{ steps.scan.outputs.sbom_sha256 }}
    steps:
      - name: Validate inputs
        env:
          ARCH: ${{ inputs.arch }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$ARCH" != amd64 && "$ARCH" != arm64 ]] ||
             [[ ${#VERSION} -gt 64 || ! $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
             [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid candidate architecture, version, or source SHA"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.source_sha != ''
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate-source
          persist-credentials: false
      - name: Build candidate OCI archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.source_sha != '' && './candidate-source' || '.' }}
          file: ${{ inputs.source_sha != '' && './candidate-source/docker/Dockerfile' || 'docker/Dockerfile' }}
          platforms: linux/${{ inputs.arch }}
          build-args: VERSION=${{ inputs.version }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: false
          push: false
      - name: Install verified Trivy
        env:
          ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) asset=Linux-64bit; digest=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75 ;;
            arm64) asset=Linux-ARM64; digest=7e3924a974e912e57b4a99f65ece7931f8079584dae12eb7845024f97087bdfd ;;
            *) exit 1 ;;
          esac
          curl -fsSL --retry 3 "https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_${asset}.tar.gz" -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "$digest  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Install verified CycloneDX CLI
        env:
          ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) asset=cyclonedx-linux-x64; digest=6c5ed6321ee3bb3c268b6d19477dbcd5509a757f118bed4b6508fe9fbbdc2a5b ;;
            arm64) asset=cyclonedx-linux-arm64; digest=2fe04169f663935ad8510ca3dfbec68f9ab2eb0136918abd00bc454ec20cbeaf ;;
            *) exit 1 ;;
          esac
          curl -fsSL --retry 3 "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.29.2/$asset" -o "$RUNNER_TEMP/cyclonedx"
          echo "$digest  $RUNNER_TEMP/cyclonedx" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cyclonedx"
      - name: Generate SBOM and scan candidate
        id: scan
        env:
          ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive_sha=$(sha256sum image.tar | cut -d ' ' -f 1)
          mkdir oci
          tar -xf image.tar -C oci
          manifest=$(jq -er --arg arch "$ARCH" '
            if (.manifests | length) == 1 and
               .manifests[0].platform.os == "linux" and
               .manifests[0].platform.architecture == $arch
            then .manifests[0].digest | select(test("^sha256:[0-9a-f]{64}$"))
            else error("invalid candidate manifest") end' oci/index.json)
          printf '%s  %s\n' "${manifest#sha256:}" "oci/blobs/sha256/${manifest#sha256:}" | sha256sum -c -
          ./trivy image --input oci --format cyclonedx --output "sbom-$ARCH.cdx.json"
          if [[ ! -f "sbom-$ARCH.cdx.json" || ! -s "sbom-$ARCH.cdx.json" ]] ||
             ! jq -es 'length == 1 and (.[0] | type == "object" and .bomFormat == "CycloneDX")' "sbom-$ARCH.cdx.json" >/dev/null; then
            echo "::error::Trivy did not produce a nonempty CycloneDX SBOM for $ARCH"
            exit 1
          fi
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 ./cyclonedx validate \
            --input-file "sbom-$ARCH.cdx.json" --input-format json --input-version v1_6 --fail-on-errors
          sbom_sha=$(sha256sum "sbom-$ARCH.cdx.json" | cut -d ' ' -f 1)
          ./trivy image --input oci --scanners vuln --severity CRITICAL --exit-code 1 --ignorefile /dev/null
          printf '%s  image.tar\n' "$archive_sha" | sha256sum -c -
          printf '%s  %s\n' "$sbom_sha" "sbom-$ARCH.cdx.json" | sha256sum -c -
          echo "archive_sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "manifest_digest=$manifest" >> "$GITHUB_OUTPUT"
          echo "sbom_sha256=$sbom_sha" >> "$GITHUB_OUTPUT"
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.arch }}
          path: ${{ runner.temp }}/sbom-${{ inputs.arch }}.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload scanned OCI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ inputs.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

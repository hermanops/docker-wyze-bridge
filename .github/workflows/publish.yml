name: Publish bridge image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric image version (for example 1.2.3)
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate release and production environment
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "hermanops/docker-wyze-bridge" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be dispatched from this fork's main branch"
            exit 1
          fi
          if [[ ${#VERSION} -gt 64 || ! $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be a numeric MAJOR.MINOR.PATCH without leading zeroes"
            exit 1
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$GITHUB_SHA" != "$head" ]]; then
            echo "::error::Dispatch must use the current main commit"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/environments/production" >/dev/null || {
            echo "::error::The production environment could not be verified"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: validate
    uses: ./.github/workflows/build-candidate.yml
    with:
      arch: amd64
      version: ${{ needs.validate.outputs.version }}

  build-arm64:
    needs: validate
    uses: ./.github/workflows/build-candidate.yml
    with:
      arch: arm64
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: ghcr-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4
    steps:
      - name: Check production release enablement
        env:
          PRODUCTION_RELEASE_ENABLED: ${{ secrets.PRODUCTION_RELEASE_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_RELEASE_ENABLED" ]]; then
            echo "::error::The production environment release enablement secret is missing"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/environments/production" >/dev/null || {
            echo "::error::The production environment could not be verified"
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-amd64
          path: ${{ runner.temp }}/sboms/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-arm64
          path: ${{ runner.temp }}/sboms/arm64
      - name: Verify scanned artifacts
        env:
          AMD64_ARCHIVE: ${{ needs.build-amd64.outputs.archive_sha256 }}
          ARM64_ARCHIVE: ${{ needs.build-arm64.outputs.archive_sha256 }}
          AMD64_SBOM: ${{ needs.build-amd64.outputs.sbom_sha256 }}
          ARM64_SBOM: ${{ needs.build-arm64.outputs.sbom_sha256 }}
        run: |
          set -euo pipefail
          [[ "$AMD64_ARCHIVE" =~ ^[0-9a-f]{64}$ && "$ARM64_ARCHIVE" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$AMD64_ARCHIVE" "$RUNNER_TEMP/candidates/candidate-amd64/image.tar" | sha256sum -c -
          printf '%s  %s\n' "$ARM64_ARCHIVE" "$RUNNER_TEMP/candidates/candidate-arm64/image.tar" | sha256sum -c -
          for arch in amd64 arm64; do
            if [[ "$arch" == amd64 ]]; then sbom_sha=$AMD64_SBOM; else sbom_sha=$ARM64_SBOM; fi
            sbom="$RUNNER_TEMP/sboms/$arch/sbom-$arch.cdx.json"
            if [[ ! "$sbom_sha" =~ ^[0-9a-f]{64}$ || ! -f "$sbom" || ! -s "$sbom" ]]; then
              echo "::error::Missing, empty, or invalid scanned SBOM for $arch"
              exit 1
            fi
            printf '%s  %s\n' "$sbom_sha" "$sbom" | sha256sum -c -
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Pull pinned Skopeo
        run: docker pull "$SKOPEO_IMAGE"
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Publish scanned manifests without rebuilding
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          AMD64_MANIFEST: ${{ needs.build-amd64.outputs.manifest_digest }}
          ARM64_MANIFEST: ${{ needs.build-arm64.outputs.manifest_digest }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AMD64_MANIFEST" =~ ^sha256:[0-9a-f]{64}$ || ! "$ARM64_MANIFEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid scanned manifest digest"
            exit 1
          fi
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for arch in amd64 arm64; do
            if [[ "$arch" == amd64 ]]; then manifest=$AMD64_MANIFEST; else manifest=$ARM64_MANIFEST; fi
            archive="/images/candidate-$arch/image.tar"
            docker run --rm \
              -v "$RUNNER_TEMP/candidates:/images:ro" \
              -v "$HOME/.docker/config.json:/auth.json:ro" \
              "$SKOPEO_IMAGE" copy --preserve-digests --authfile /auth.json \
              "oci-archive:$archive" "docker://$ghcr:build-$suffix-$arch"
            actual=$(docker run --rm \
              -v "$HOME/.docker/config.json:/auth.json:ro" \
              "$SKOPEO_IMAGE" inspect --raw --authfile /auth.json \
              "docker://$ghcr@$manifest" | sha256sum | cut -d ' ' -f 1)
            if [[ "sha256:$actual" != "$manifest" ]]; then
              echo "::error::Published manifest does not match the scanned digest"
              exit 1
            fi
          done
          if [[ ! "$GITHUB_REPOSITORY_OWNER" =~ ^[A-Za-z0-9-]+$ || ! "$GHCR_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid GHCR authentication credentials"
            exit 1
          fi
          registry_token=$(printf 'user = "%s:%s"\n' "$GITHUB_REPOSITORY_OWNER" "$GHCR_TOKEN" |
            curl --disable --config - --silent --show-error --fail --get \
              --connect-timeout 10 --max-time 60 \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:${GITHUB_REPOSITORY,,}:pull" \
              https://ghcr.io/token |
            jq -ers 'select(length == 1) | .[0] | select(type == "object") |
              (.token // .access_token) | select(type == "string" and test("^[A-Za-z0-9._~+/=-]+$"))') || {
              echo "::error::Could not authenticate to GHCR"
              exit 1
            }
          registry_manifest() {
            printf 'header = "Authorization: Bearer %s"\n' "$registry_token" |
              curl --disable --config - --silent --show-error \
                --connect-timeout 10 --max-time 60 --max-filesize 4194304 \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                --output "$RUNNER_TEMP/ghcr-manifest-response.json" --write-out '%{http_code}' \
                "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/manifests/$1"
          }
          status=$(registry_manifest "$AMD64_MANIFEST") || {
            echo "::error::Could not verify access to the GHCR repository"
            exit 1
          }
          if [[ "$status" != 200 ]] ||
             [[ "sha256:$(sha256sum "$RUNNER_TEMP/ghcr-manifest-response.json" | cut -d ' ' -f 1)" != "$AMD64_MANIFEST" ]]; then
            echo "::error::Could not verify access to the scanned GHCR manifest"
            exit 1
          fi
          status=$(registry_manifest "$VERSION") || {
            echo "::error::Could not check the GHCR version manifest"
            exit 1
          }
          if [[ "$status" == 200 ]]; then
            echo "::error::GHCR version tag $ghcr:$VERSION already exists"
            exit 1
          fi
          if [[ "$status" != 404 ]] ||
             ! jq -es 'length == 1 and (.[0] | type == "object" and
               (.errors | type == "array" and length == 1) and .errors[0].code == "MANIFEST_UNKNOWN")' \
               "$RUNNER_TEMP/ghcr-manifest-response.json" >/dev/null; then
            echo "::error::GHCR did not confirm that the version manifest is missing (HTTP $status)"
            exit 1
          fi
          docker buildx imagetools create --tag "$ghcr:$VERSION" \
            "$ghcr@$AMD64_MANIFEST" "$ghcr@$ARM64_MANIFEST"
      - name: Verify published multi-architecture tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          AMD64_MANIFEST: ${{ needs.build-amd64.outputs.manifest_digest }}
          ARM64_MANIFEST: ${{ needs.build-arm64.outputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          if ! docker run --rm \
            -v "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" inspect --raw --authfile /auth.json \
            "docker://$ghcr:$VERSION" |
            jq -e --arg amd64 "$AMD64_MANIFEST" --arg arm64 "$ARM64_MANIFEST" '
              .schemaVersion == 2 and
              (.mediaType == "application/vnd.oci.image.index.v1+json" or
               .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
              (.manifests | type == "array" and length == 2) and
              ([.manifests[] | {os: .platform.os, arch: .platform.architecture, digest}] | sort_by(.arch)) ==
              ([{os: "linux", arch: "amd64", digest: $amd64},
                {os: "linux", arch: "arm64", digest: $arm64}] | sort_by(.arch))
            ' >/dev/null; then
            echo "::error::Published tag $ghcr:$VERSION does not match the scanned candidates"
            exit 1
          fi

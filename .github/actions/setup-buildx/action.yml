name: Set up verified Buildx
description: Install a checksum-verified Buildx and use a digest-pinned BuildKit.

runs:
  using: composite
  steps:
    - name: Install verified Buildx
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64) arch=amd64; digest=e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4 ;;
          ARM64) arch=arm64; digest=3b83b3731916ba433feccaaa689fe5bcdc81c641d92c8e6c2ea865dfa141c97a ;;
          *) echo "::error::Unsupported runner architecture: $RUNNER_ARCH"; exit 1 ;;
        esac
        curl -fsSL --retry 3 "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-$arch" -o "$RUNNER_TEMP/docker-buildx"
        sh "$GITHUB_WORKSPACE/docker/verify-sha256.sh" "$RUNNER_TEMP/docker-buildx" "$digest"
        mkdir -p "$HOME/.docker/cli-plugins"
        install -m 0755 "$RUNNER_TEMP/docker-buildx" "$HOME/.docker/cli-plugins/docker-buildx"
        docker buildx version
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
        buildkitd-flags: --debug=false
        cache-binary: false
